version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/ErosTTS.Bot
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 5
